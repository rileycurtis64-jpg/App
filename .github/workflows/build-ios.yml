name: Build iOS Device IPA
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/build-ios.yml'
      - 'ios/**'
      - 'src/**'
      - '.env'
      - 'package.json'
      - 'bun.lock'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: 🛒 Checkout
        uses: actions/checkout@v6

      - name: 🖥 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - name: 💬 Read app version
        run: echo VERSION_NUMBER=$(bun -p "require('./package.json').version") >> $GITHUB_ENV

      - name: 🍎 Setup Xcode
        uses: ./.github/actions/setup-xcode

      - name: 📦 Install dependencies and CocoaPods
        run: bun run init-ios:new-arch

      - name: 🔍 TypeScript check
        run: bun run tsc

      - name: 📱 Build unsigned iPhone app
        run: |
          cd ios
          set -o pipefail
          xcodebuild \
            CC=clang CPLUSPLUS=clang++ LD=clang LDPLUSPLUS=clang++ \
            -derivedDataPath build \
            -UseModernBuildSystem=YES \
            -workspace Jellify.xcworkspace \
            -scheme 'Jellify - Release' \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: 📦 Package unsigned IPA
        run: |
          APP_PATH="ios/build/Build/Products/Release-iphoneos/Jellify.app"
          test -d "$APP_PATH"
          rm -rf Payload
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          zip -qry "Jelly-Music-iPhone-${VERSION_NUMBER}-unsigned.ipa" Payload
          ls -lh "Jelly-Music-iPhone-${VERSION_NUMBER}-unsigned.ipa"

      - name: ⬆️ Upload iPhone IPA
        uses: actions/upload-artifact@v7
        with:
          name: jelly-music-iphone-pr-${{ github.event.number || 'manual' }}-${{ env.VERSION_NUMBER }}
          path: Jelly-Music-iPhone-${{ env.VERSION_NUMBER }}-unsigned.ipa
          retention-days: 7
          if-no-files-found: error
